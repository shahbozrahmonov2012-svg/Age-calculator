<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Calculator 2026</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="header-section">
    <h1>Age Calculator 🧮</h1>
    <p class="subtitle">Know your exact age instantly</p>
  </div>

  <div class="form-group">

    <label>📍 Your Region</label>

    <div class="timezone-field">
      <input id="timezoneInput" list="timezoneList" placeholder="Search timezone">
      <datalist id="timezoneList"></datalist>

      <button id="gpsBadge" class="gps-button">
        📍
      </button>
    </div>

    <div class="info-line">
      <span id="timezoneInfo">Detecting location...</span>
    </div>

  </div>

  <div class="form-group">

    <label>🗓 Birth Date</label>

    <input type="date" id="birthDate">

    <button id="calculateBtn">
      ✨ Calculate My Age
    </button>

  </div>

  <div id="result" class="result-card hidden">

    <div class="age-display">
      <span id="summaryText"></span>
    </div>

    <div id="equivalent" class="equivalent"></div>

    <button id="toggleDetailsBtn" class="show-all-btn hidden">
      Show Details
    </button>

    <div id="details" class="details hidden"></div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
