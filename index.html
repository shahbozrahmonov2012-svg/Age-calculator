<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Age Calculator 2026</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="header-section">
    <h1>Age Calculator <span class="title-emoji">🧮</span></h1>
    <p class="subtitle">Know your exact age in years, months, days, and more</p>
  </div>

  <div class="settings">
    <div class="setting-group">
      <label for="timezoneInput"><span class="label-emoji">📍</span>Your Region</label>
      <div class="timezone-field">
        <input 
          list="timezoneList" 
          id="timezoneInput" 
          placeholder="Search timezone or tap GPS to auto-detect"
          autocomplete="off"
        />
        <datalist id="timezoneList"></datalist>
        <button type="button" class="gps-button" id="gpsBadge" title="Auto-detect your location">📍</button>
      </div>
    </div>

    <div class="info-line">
      <span id="timezoneInfo">Detecting location...</span>
    </div>
  </div>

  <div class="form-group">
    <label for="birthDate">When were you born?</label>
    <div class="date-display-line">
      <span class="calendar-icon" id="calendarEmojiButton">🗓️</span>
      <span id="chosenDate">Choose date</span>
    </div>
    <div class="date-input-line">
      <input type="text" id="birthDate" placeholder="YYYY-MM-DD" required>
    </div>
    <p id="mobileDateHint" class="mobile-hint hidden">Enter your birth date</p>
    <button type="button" id="calculateBtn" class="primary-btn">
      <span class="button-emoji">✨</span> Calculate My Age
    </button>
  </div>

  <div id="result" class="result-card hidden">
    <div class="summary-section">
      <div class="age-display-wrapper">
        <div class="age-display">
          <span id="summaryText"></span>
        </div>
      </div>
    </div>

    <div id="equivalent" class="equivalent hidden"></div>

    <div class="show-all-wrapper">
      <button type="button" id="toggleDetailsBtn" class="show-all-btn hidden">
        📊 Show all 
      </button>
    </div>

    <div id="details" class="details hidden"></div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
